<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Ram Fit</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    #ramFitSplash{position:fixed;inset:0;z-index:99999;background:#f3f4f6;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .35s ease}
    #ramFitSplash.hide{opacity:0;pointer-events:none}
    .rf-splash-wrap{position:relative;width:min(62vw,280px);aspect-ratio:1/1;animation:rfPop .55s cubic-bezier(.2,.9,.25,1.2) both}
    .rf-splash-icon{width:100%;height:100%;object-fit:contain;display:block;border-radius:22%}
    .rf-eyelid{position:absolute;height:8%;width:13%;background:#f3f4f6;border-radius:50%;transform:scaleY(0);transform-origin:center;animation:rfBlink 3s ease-in-out 1 both;pointer-events:none}
    .rf-eye-left{left:33%;top:37.5%}.rf-eye-right{right:33%;top:37.5%}
    @keyframes rfPop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
    @keyframes rfBlink{0%,28%,38%,64%,74%,100%{transform:scaleY(0)}32%,35%,68%,71%{transform:scaleY(1)}}
  </style>
</head>
<body>
  <div id="ramFitSplash"><div class="rf-splash-wrap"><img class="rf-splash-icon" src="icon-512.png" alt="Ram Fit"><span class="rf-eyelid rf-eye-left"></span><span class="rf-eyelid rf-eye-right"></span></div></div>
  <script>setTimeout(()=>{const s=document.getElementById('ramFitSplash');if(s){s.classList.add('hide');setTimeout(()=>s.remove(),400)}},3000);</script>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow" id="todayDate"></div><h1>Ram Fit</h1></div>
      <button class="icon-btn" id="notifBtn" title="התראות">🔔</button>
    </header>
    <main id="view"></main>
    <nav class="bottom-nav">
      <button data-route="today" class="nav-btn active">🏠<span>היום</span></button>
      <button data-route="workouts" class="nav-btn">🏋️<span>אימונים</span></button>
      <button data-route="food" class="nav-btn">🍽️<span>אוכל</span></button>
      <button data-route="progress" class="nav-btn">📈<span>התקדמות</span></button>
      <button data-route="settings" class="nav-btn">⚙️<span>הגדרות</span></button>
    </nav>
  </div>
  <template id="cardTpl"><section class="card"></section></template>
  <script>
    if('serviceWorker' in navigator){
      let reloading=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload()}});
      navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
        reg.update();
        setInterval(()=>reg.update(),5*60*1000);
        if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
        reg.addEventListener('updatefound',()=>{
          const nw=reg.installing;
          nw?.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)nw.postMessage({type:'SKIP_WAITING'})});
        });
      }).catch(()=>{});
    }
  </script>
  <script src="app.js"></script>
  <script src="reminder-enhance.js"></script>
  <script src="workout-flex.js"></script>
  <script src="health-tracking.js"></script>
  <script src="meal-expansion.js"></script>
  <script src="report-share.js"></script>
  <script src="barcode-food.js"></script>
</body>
</html>
