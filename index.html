<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Ram Fit</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>

      <button data-route="settings" class="nav-btn">⚙️<span>הגדרות</span></button>
    </nav>
  </div>
  <template id="cardTpl"><section class="card"></section></template>
  <script src="app.js"></script>
  <script src="reminder-enhance.js"></script>
  <script src="workout-flex.js"></script>
  <script src="health-tracking.js"></script>
  <script src="report-share.js"></script>

</html>
